name: Build Nala APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Unpack Nala project
        run: |
          rm -rf buildsrc
          mkdir buildsrc
          unzip -q NalaAssistant_MVP_0.2.zip -d buildsrc

      - name: Build APK
        run: |
          gradle -p buildsrc/NalaAssistant_MVP_0.2 :app:assembleDebug --stacktrace
          cp buildsrc/NalaAssistant_MVP_0.2/app/build/outputs/apk/debug/app-debug.apk NalaAssistant.apk

      - name: Create downloadable APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nala-build-${{ github.run_number }}
          name: Nala Assistant build ${{ github.run_number }}
          files: NalaAssistant.apk
